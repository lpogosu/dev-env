# tmux. No plugin manager here either: everything below is a built-in option.

set -g prefix C-a
unbind C-a
bind C-a send-prefix
# C-b is the reader's own key in emacs, in readline and in zsh's emacs bindings.
# C-a collides with beginning-of-line, which is why the binding above sends it
# through on a double press.

set -g default-terminal 'tmux-256color'
# Tell tmux that the *outer* terminal can do 24-bit colour. Without this, a
# colour scheme inside nvim inside tmux degrades to 256 colours and nothing
# says why.
set -ga terminal-overrides ',*256col*:RGB,xterm*:RGB'

# The default 500 ms means tmux waits half a second after Escape to see whether
# a function-key sequence follows. In nvim that is half a second of "why am I
# still in insert mode".
set -g escape-time 10

# Long enough to scroll back through a build, short enough that fifty panes do
# not become a memory problem.
set -g history-limit 50000

set -g mouse on
set -g focus-events on          # nvim's autoread needs these to fire
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
# Window 0 is below 1 on the keyboard on no layout in existence.

set -g display-time 2000
set -g status-interval 5

# Splits and new windows inherit the current pane's directory. The default is
# the directory the server was started in, which after a day is never the one
# that was wanted.
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Resize with the prefix held, repeatable.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file "$HOME/.config/tmux/tmux.conf" \; display 'reloaded'

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Status line: session name, windows, host. No clock, no battery, no CPU graph
# — a status line that changes every second is a status line that is being read
# instead of the work.
set -g status-style 'bg=colour236,fg=colour250'
set -g status-left '#[bold] #S #[default]'
set -g status-left-length 24
set -g status-right '#[fg=colour244]#h '
set -g window-status-current-style 'fg=colour223,bold'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g pane-active-border-style 'fg=colour244'
set -g pane-border-style 'fg=colour238'

# Machine-local overrides, created by bootstrap.sh and never tracked. -q keeps
# tmux quiet if it is missing, which it will be until the first bootstrap.
source-file -q "$HOME/.config/tmux/local.conf"
